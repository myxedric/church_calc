<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Church Sharing Calculator</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .calculator {
      background: white;
      border-radius: 24px;
      padding: 32px 40px;
      width: 100%;
      max-width: 900px;
      box-shadow: 0 8px 32px rgba(46, 125, 50, 0.15);
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    header h1 {
      font-size: 28px;
      color: #2e7d32;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    header p {
      color: #66bb6a;
      font-size: 16px;
      margin-top: 6px;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
    }

    .input-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-size: 15px;
      font-weight: 600;
      color: #388e3c;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .input-group input {
      padding: 14px 16px;
      font-size: 20px;
      border: 2px solid #c8e6c9;
      border-radius: 12px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-group input:focus {
      border-color: #66bb6a;
    }

    .input-group input[readonly] {
      background: #f1f8e9;
      font-weight: 700;
      color: #2e7d32;
    }

    button {
      padding: 16px;
      font-size: 18px;
      font-weight: 700;
      background: linear-gradient(135deg, #43a047, #2e7d32);
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(46, 125, 50, 0.3);
    }

    .results-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .result-card {
      background: #f1f8e9;
      border-radius: 14px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .result-card.highlight {
      background: linear-gradient(135deg, #c8e6c9, #a5d6a7);
    }

    .result-card .info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .result-card .icon {
      width: 40px;
      height: 40px;
      background: #43a047;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 18px;
    }

    .result-card.highlight .icon {
      background: #2e7d32;
    }

    .result-card .label {
      font-size: 14px;
      color: #558b2f;
      font-weight: 500;
    }

    .result-card .title {
      font-size: 16px;
      color: #2e7d32;
      font-weight: 700;
    }

    .result-card .value {
      font-size: 22px;
      font-weight: 700;
      color: #1b5e20;
      font-family: 'Consolas', monospace;
    }

    @media (max-width: 700px) {
      .main-grid {
        grid-template-columns: 1fr;
        gap: 24px;
      }
      .calculator {
        padding: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="calculator">
    <header>
      <h1><i class="fas fa-church"></i> Church Sharing Calculator</h1>
      <p>Compute weekly giving distribution</p>
    </header>

    <div class="main-grid">
      <div class="input-section">
        <div class="input-group">
          <label><i class="fas fa-hand-holding-heart"></i> Tithe (₱)</label>
          <input type="number" id="tithe" placeholder="0.00" min="0" step="0.01" inputmode="decimal" oninput="calculateSharing()" />
        </div>

        <div class="input-group">
          <label><i class="fas fa-gift"></i> Offering (₱)</label>
          <input type="number" id="offering" placeholder="0.00" min="0" step="0.01" inputmode="decimal" oninput="calculateSharing()" />
        </div>

        <div class="input-group">
          <label><i class="fas fa-coins"></i> Total (₱)</label>
          <input type="number" id="total" readonly value="0.00" />
        </div>

        <button type="button" onclick="calculateSharing()">
          <i class="fas fa-calculator"></i> Calculate
        </button>
      </div>

      <div class="results-section">
        <div class="result-card">
          <div class="info">
            <div class="icon"><i class="fas fa-building"></i></div>
            <div>
              <div class="label">5%</div>
              <div class="title">District Share</div>
            </div>
          </div>
          <div class="value" id="districtShare">₱0.00</div>
        </div>

        <div class="result-card">
          <div class="info">
            <div class="icon"><i class="fas fa-church"></i></div>
            <div>
              <div class="label">30% of remaining</div>
              <div class="title">Church Share</div>
            </div>
          </div>
          <div class="value" id="churchShare">₱0.00</div>
        </div>

        <div class="result-card">
          <div class="info">
            <div class="icon"><i class="fas fa-user-tie"></i></div>
            <div>
              <div class="label">70% of remaining</div>
              <div class="title">Pastor Share</div>
            </div>
          </div>
          <div class="value" id="pastorShare">₱0.00</div>
        </div>

        <div class="result-card highlight">
          <div class="info">
            <div class="icon"><i class="fas fa-percent"></i></div>
            <div>
              <div class="label">10% of Pastor</div>
              <div class="title">Pastor's Tithe</div>
            </div>
          </div>
          <div class="value" id="pastorTithe">₱0.00</div>
        </div>

        <div class="result-card highlight">
          <div class="info">
            <div class="icon"><i class="fas fa-wallet"></i></div>
            <div>
              <div class="label">Net</div>
              <div class="title">Pastor Take-Home</div>
            </div>
          </div>
          <div class="value" id="pastorNet">₱0.00</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function formatMoney(value) {
      return "₱" + value.toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function calculateSharing() {
      const tithe = parseFloat(document.getElementById("tithe").value) || 0;
      const offering = parseFloat(document.getElementById("offering").value) || 0;
      const total = tithe + offering;

      document.getElementById("total").value = total.toFixed(2);

      // 5% goes to district
      const districtShare = total * 0.05;
      // Remaining after district share
      const remaining = total - districtShare;
      // 30% of remaining goes to church
      const churchShare = remaining * 0.30;
      // 70% of remaining goes to pastor
      const pastorShare = remaining * 0.70;
      // Pastor's tithe is 10% of pastor share
      const pastorTithe = pastorShare * 0.10;
      // Net take-home is pastor share minus tithe
      const pastorNet = pastorShare - pastorTithe;

      document.getElementById("districtShare").textContent = formatMoney(districtShare);
      document.getElementById("churchShare").textContent = formatMoney(churchShare);
      document.getElementById("pastorShare").textContent = formatMoney(pastorShare);
      document.getElementById("pastorTithe").textContent = formatMoney(pastorTithe);
      document.getElementById("pastorNet").textContent = formatMoney(pastorNet);
    }
  </script>
</body>
</html>
